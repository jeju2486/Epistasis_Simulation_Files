[paths]
reference = "inputs/reference_100kb.fa"
checkpoint_root = "checkpoints_100kb_neutral30k_mu2e8"
run_root = "runs_100kb_controlled_assay_mu2e8"
manifest_root = "manifests"

[design]
# Five matched biological replicates for each mode x cross-HGT setting.
# This expands to 5 x 3 = 15 checkpoints and 5 x 3 x 3 = 45 continuations.
replicates = 5
modes = [0, 1, 2]
cross_hgt_probabilities = [0.0, 0.002, 0.02]
master_seed = 20260809

[genome]
length = 100000
reference_seed = 2486
mutation_rate = 2e-8
mean_hgt_tract = 500
within_hgt_probability = 0.02

[population]
ancestral_size = 10000
clade_size = 5000
terminal_size = 2500
sample_per_terminal = 250
ancestral_generations = 10000
deep_clade_generations = 10000
terminal_generations = 10000

[loci]
a_position = 10000
b_position = 20000
c_position = 60000
d_position = 85000

[experiment]
generations = 300
s_ab = 0.003
s_cd = 0.003
monitor_every = 25

[postprocess]
ancestral_ne = 10000
oracle_tree_position = 50000

name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Shell checks
        run: shellcheck scripts/*.sh
      - name: SLiM syntax checks
        run: |
          slim -c slim/build_checkpoint.slim
          slim -c slim/continue_experiment.slim
      - name: End-to-end smoke simulation
        run: |
          python scripts/prepare_inputs.py --config config/smoke.toml
          python scripts/build_manifest.py --config config/smoke.toml
          python scripts/run_manifest.py --manifest manifests_smoke/checkpoints.tsv --stage checkpoint --jobs 1
          python scripts/run_manifest.py --manifest manifests_smoke/cases.tsv --stage case --jobs 1
          python scripts/show_status.py manifests_smoke/checkpoints.tsv manifests_smoke/cases.tsv

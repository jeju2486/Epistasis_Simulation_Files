[paths]
reference = "inputs/reference_50kb.fa"
checkpoint_root = "checkpoints_50kb_mu2e8"
run_root = "runs_50kb_mu2e8"
manifest_root = "manifests"

[design]
# Five matched biological replicates for each mode x cross-HGT setting.
# This expands to 5 checkpoints and 5 x 2 x 3 = 30 continuations.
replicates = 5
modes = [0, 1]
cross_hgt_probabilities = [0.0, 0.002, 0.02]
master_seed = 20260809

[genome]
length = 50000
reference_seed = 2486
mutation_rate = 2e-8
mean_hgt_tract = 500
within_hgt_probability = 0.02

[population]
ancestral_size = 10000
clade_size = 5000
terminal_size = 2500
sample_per_terminal = 250
ancestral_generations = 5000
deep_clade_generations = 1000
terminal_generations = 1000

[loci]
global_frequency_min = 0.30
global_frequency_max = 0.70
lineage_frequency_min = 0.20
lineage_frequency_max = 0.80
minimum_distance = 5000

[experiment]
generations = 1000
s_ab = 0.001
s_cd = 0.0015
monitor_every = 50

[postprocess]
ancestral_ne = 10000
oracle_tree_position = 25000
